services:
  db:
    image: postgres:16-alpine
    container_name: multiplicador_postgres
    restart: always
    environment:
      POSTGRES_DB: \
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \ -d \"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: multiplicador_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://\:\@db:5432/\
      - SECRET_KEY=\
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/temp_uploads

volumes:
  postgres_data:
  uploads_data:
